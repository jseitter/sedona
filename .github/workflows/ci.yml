# Builds the Sedona tools, the kits and the Sedona VM, then runs the
# sedonac and the svm test suites, once for every pointer size and CPU
# the VM supports.
#
# The results of a run are on its summary page.  The complete console
# output and JUnit XML files are kept as artifacts of the run.

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit VM, the layout all existing Sedona devices use
          - name: linux-x64-32bit
            os: ubuntu-24.04
            platform: generic-unix.xml
            scode: x86-test.xml
            packages: gcc-multilib

          - name: linux-x64-64bit
            os: ubuntu-24.04
            platform: generic-unix64.xml
            scode: unix64-test.xml

          - name: linux-arm64-64bit
            os: ubuntu-24.04-arm
            platform: generic-unix64.xml
            scode: unix64-test.xml

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install packages
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Build
        id: build
        run: |
          source adm/unix/init.sh
          python3 adm/makedev.py --test none \
            --platform platforms/src/generic/unix/${{ matrix.platform }} \
            --scode scode/${{ matrix.scode }}
          test -x bin/svm

      - name: Test sedonac
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          source adm/unix/init.sh
          python3 adm/testreport.py --suite sedonac --timeout 900 -- bin/sedonac.sh -test

      - name: Test svm
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          source adm/unix/init.sh
          scode=scode/${{ matrix.scode }}
          python3 adm/testreport.py --suite svm --timeout 600 -- bin/svm "${scode%.xml}.scode" -test

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: build/test-results/
          if-no-files-found: warn
